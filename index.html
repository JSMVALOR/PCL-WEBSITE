    <!-- Anti-FOUC Theme Script for ERP -->
    <script>
      (function() {
        try {
          // Only apply forced theme loading for ERP paths
          if (window.location.pathname.startsWith('/erp')) {
            var savedTheme = localStorage.getItem('jsmerp_theme');
            if (savedTheme === 'light') savedTheme = 'marble-executive';
            if (savedTheme === 'dark') savedTheme = 'dark-luxury';
            var isDarkOS = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            var themeToApply = savedTheme || (isDarkOS ? 'dark-luxury' : 'marble-executive');
            
            document.documentElement.setAttribute('data-theme', themeToApply);
            
            var lightThemes = ['marble-executive', 'structural-neo-brutalism'];
            if (lightThemes.indexOf(themeToApply) !== -1) {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
