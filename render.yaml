services:
  - type: web
    name: pcl-whatsapp-engine
    env: node
    rootDir: backend/whatsapp-server
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        sync: false
